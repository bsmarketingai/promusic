<!-- @dsCard group="Colors" viewport="700x180" subtitle="Brand oranžová + stavy" name="Brand accent" -->
<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--pm-font-body);padding:22px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .sw{flex:1;min-width:120px;border-radius:var(--pm-radius-md);overflow:hidden;border:1px solid var(--border);}
  .chip{height:72px;}
  .meta{padding:9px 11px;background:var(--surface);}
  .name{font-family:var(--pm-font-mono);font-size:11px;font-weight:700;letter-spacing:.04em;}
  .hex{font-family:var(--pm-font-mono);font-size:11px;color:var(--text-mute);margin-top:2px;}
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--pm-accent)"></div><div class="meta"><div class="name">accent</div><div class="hex">#e0542b</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--pm-accent-bright)"></div><div class="meta"><div class="name">hover</div><div class="hex">#f2693f</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--pm-accent-deep)"></div><div class="meta"><div class="name">press</div><div class="hex">#b83f1c</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--pm-accent-tint)"></div><div class="meta"><div class="name">tint 10%</div><div class="hex">rgba(224,84,43,.10)</div></div></div>
  </div>
</body></html>
