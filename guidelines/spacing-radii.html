<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--pm-font-mono);padding:24px;}
  .row{display:flex;gap:18px;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:72px;height:56px;background:var(--surface-2);border:1.5px solid var(--border-strong);}
  .n{font-size:10.5px;color:var(--text-mute);}
</style></head><body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:var(--pm-radius-sm)"></div><span class="n">sm · 8</span></div>
    <div class="col"><div class="box" style="border-radius:var(--pm-radius-md)"></div><span class="n">md · 12</span></div>
    <div class="col"><div class="box" style="border-radius:var(--pm-radius-lg)"></div><span class="n">lg · 18</span></div>
    <div class="col"><div class="box" style="border-radius:var(--pm-radius-xl)"></div><span class="n">xl · 28</span></div>
    <div class="col"><div class="box" style="border-radius:var(--pm-radius-pill);width:96px"></div><span class="n">pill</span></div>
  </div>
</body></html>
