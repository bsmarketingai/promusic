<!-- @dsCard group="Brand" viewport="700x240" subtitle="Primární logo — vždy na tmavém" name="Logo" -->
<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--pm-font-mono);padding:0;}
  .wrap{display:flex;height:240px;}
  .main{flex:1;display:flex;align-items:center;justify-content:center;background:var(--pm-paper);}
  .main img{width:260px;max-width:70%;}
  .alt{width:230px;display:flex;align-items:center;justify-content:center;background:var(--pm-black);border-left:1px solid var(--border);}
  .alt img{width:170px;}
  .cap{position:absolute;bottom:10px;left:16px;font-size:10px;color:var(--text-mute);}
</style></head><body>
  <div class="wrap">
    <div class="main"><img src="../assets/brand/promusic-logo.png" alt="PRO MUSIC"></div>
    <div class="alt"><img src="../assets/brand/promusic-logo.png" alt="PRO MUSIC"></div>
  </div>
  <div class="cap">bílý wordmark + oranžová zvuková vlna · používat výhradně na tmavém pozadí (#100f0d / #070605)</div>
</body></html>
