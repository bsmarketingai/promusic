<script>
/* náhled: outline-glow + accordion chování bez loaderu */
/* Tento skript běží POUZE při samostatném otevření komponenty.
   Při importu přes ui-loader.js se nespouští (loader přebírá jen markup),
   takže na stránkách zůstává menu zavřené a otevírá ho FAB. */
document.getElementById("mobmenu").classList.add("open");
document.querySelectorAll(".btn,.outline-glow,.mobitem-label,.foot-col a").forEach(function(el){
  el.addEventListener("pointermove",function(e){var r=el.getBoundingClientRect();
    el.style.setProperty("--mx",((e.clientX-r.left)/r.width*100).toFixed(1)+"%");
    el.style.setProperty("--my",((e.clientY-r.top)/r.height*100).toFixed(1)+"%");});
});
document.querySelectorAll(".mobitem.has-sub .mobitem-row").forEach(function(row){
  row.addEventListener("click",function(e){
    if(e.target.closest(".mobitem-label")) return;
    var open=row.parentElement.classList.toggle("exp");
    var p=row.querySelector(".mobitem-plus"); if(p) p.textContent=open?"–":"+";
  });
});
</script>
