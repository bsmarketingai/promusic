<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PRO MUSIC — Wireframy webu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Gloria+Hallelujah&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="wf-style.css?v=21" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wf-shared.jsx?v=12"></script>
<script type="text/babel" src="wf-directionA.jsx?v=14"></script>
<script type="text/babel" data-presets="react">
/* shell: single direction + Tweaks + motion */
const { useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#e0542b",
  "type": "Velká",
  "density": "Vzdušné",
  "hero": "Cinematic",
  "light": false,
  "guide": true
}/*EDITMODE-END*/;

const TYPE_MAP = { "Kompaktní": 0.88, "Standard": 1, "Velká": 1.18 };
const DENS_MAP = { "Vzdušné": 1.18, "Standard": 1, "Nabité": 0.82 };
const SCRIM_MAP = { "Cinematic": 0.88, "Editorial": 0.62 };

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const rootRef = useRef(null);

  useEffect(() => {
    const root = rootRef.current;
    if (!root) return;
    const reveals = Array.from(root.querySelectorAll(".reveal, [data-stagger]"));
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    reveals.forEach((el) => io.observe(el));

    const pars = Array.from(root.querySelectorAll("[data-par],[data-zoom]"));
    let raf = null;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const vh = window.innerHeight;
        pars.forEach((el) => {
          const r = el.getBoundingClientRect();
          let tf = "";
          if (el.hasAttribute("data-par")) {
            const f = parseFloat(el.getAttribute("data-par")) || 0.08;
            const center = r.top + r.height / 2 - vh / 2;
            let y = -center * f;
            const cap = r.height * 0.14;
            if (y > cap) y = cap; if (y < -cap) y = -cap;
            tf += `translate3d(0,${y.toFixed(1)}px,0) `;
          }
          if (el.hasAttribute("data-zoom")) {
            const z = parseFloat(el.getAttribute("data-zoom")) || 0.14;
            let prog = (vh - r.top) / (vh + r.height);
            prog = Math.min(Math.max(prog, 0), 1);
            tf += `scale(${(1 + z * (1 - prog)).toFixed(3)})`;
          }
          el.style.transform = tf;
        });
        raf = null;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    // ===== POINTER PARALLAX („švenk" — náhled mění úhel podle myši) =====
    const tilts = Array.from(root.querySelectorAll("[data-tilt]"));
    const reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    let onMove = null, traf = null;
    // základní stav (mírně zvětšeno, ať náklon nikdy neodhalí kraj)
    tilts.forEach((el) => { el.style.transform = "scale(1.12)"; });
    if (tilts.length && !reduce) {
      let tX = 0, tY = 0, cX = 0, cY = 0;
      const loop = () => {
        cX += (tX - cX) * 0.09;
        cY += (tY - cY) * 0.09;
        tilts.forEach((el) => {
          const amt = parseFloat(el.getAttribute("data-tilt")) || 16;
          const rot = parseFloat(el.getAttribute("data-tilt-rot")) || 5;
          el.style.transform =
            `scale(1.12) translate3d(${(-cX * amt).toFixed(2)}px,${(-cY * amt).toFixed(2)}px,0)` +
            ` rotateY(${(cX * rot).toFixed(2)}deg) rotateX(${(-cY * rot).toFixed(2)}deg)`;
        });
        if (Math.abs(tX - cX) > 0.0008 || Math.abs(tY - cY) > 0.0008) traf = requestAnimationFrame(loop);
        else traf = null;
      };
      onMove = (e) => {
        tX = (e.clientX / window.innerWidth) - 0.5;
        tY = (e.clientY / window.innerHeight) - 0.5;
        if (!traf) traf = requestAnimationFrame(loop);
      };
      window.addEventListener("pointermove", onMove, { passive: true });
    }

    return () => {
      io.disconnect();
      window.removeEventListener("scroll", onScroll);
      if (onMove) window.removeEventListener("pointermove", onMove);
      if (traf) cancelAnimationFrame(traf);
    };
  }, []);

  const appStyle = {
    "--accent": t.accent,
    "--type": TYPE_MAP[t.type] || 1,
    "--sp": DENS_MAP[t.density] || 1,
    "--scrim": SCRIM_MAP[t.hero] || 0.85,
  };

  return (
    <div ref={rootRef} className={"app" + (t.light ? " light" : "") + (t.guide ? " guide" : "") + " hero-" + (t.hero || "Cinematic").toLowerCase()} style={appStyle}>
      <div className="layoutguide" aria-hidden="true">
        <div className="cont"></div>
        <div className="lg-legend"><span><b>▢ container</b> max 1180px</span><span><i>⟷ full-bleed</i> = přes celou šířku</span></div>
      </div>
      <div className="topbar">
        <div className="brandmark">PRO&nbsp;<b>MUSIC</b> · wireframe</div>
        <div className="tabmeta" style={{ marginLeft: "auto" }}>
          <span><span className="dot"></span>Showreel / Cinematic · dark · CZ/EN</span>
        </div>
      </div>

      <DirectionA />

      <TweaksPanel>
        <TweakSection label="Vzhled" />
        <TweakColor label="Akcentní barva" value={t.accent}
          options={["#e0542b", "#2f6de0", "#3fb27f", "#c0398f"]}
          onChange={(v) => setTweak("accent", v)} />
        <TweakRadio label="Velikost typografie" value={t.type}
          options={["Kompaktní", "Standard", "Velká"]}
          onChange={(v) => setTweak("type", v)} />
        <TweakRadio label="Hustota obsahu" value={t.density}
          options={["Vzdušné", "Standard", "Nabité"]}
          onChange={(v) => setTweak("density", v)} />
        <TweakSection label="Hero" />
        <TweakRadio label="Styl hero" value={t.hero}
          options={["Cinematic", "Editorial"]}
          onChange={(v) => setTweak("hero", v)} />
        <TweakSection label="Režim" />
        <TweakToggle label="Světlý režim (náhled)" value={t.light}
          onChange={(v) => setTweak("light", v)} />
        <TweakToggle label="Layout vodítka (container / full-bleed)" value={t.guide}
          onChange={(v) => setTweak("guide", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
