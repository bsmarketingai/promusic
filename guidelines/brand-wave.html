<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--pm-font-mono);padding:0;overflow:hidden;}
  .stage{position:relative;height:180px;display:flex;align-items:center;padding:0 28px;}
  .wave{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--border);}
  .wave svg{position:absolute;left:0;top:-30px;width:100%;height:60px;}
  .label{position:relative;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-mute);background:var(--bg);padding-right:14px;}
  .acc{color:var(--accent);}
</style></head><body>
  <div class="stage">
    <div class="wave">
      <svg viewBox="0 0 1200 60" preserveAspectRatio="none" fill="none">
        <path d="M0 30 Q 150 -10 300 30 T 600 30 T 900 30 T 1200 30" stroke="#e0542b" stroke-width="3"/>
      </svg>
    </div>
    <span class="label">Sinusoida ze znaku → <span class="acc">dělič sekcí, akcentní linka, animovaný motiv</span></span>
  </div>
</body></html>
