<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PRO MUSIC — Wireframy webu (print)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Gloria+Hallelujah&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="wf-style.css?v=19" />
<style>
/* on-screen: show as continuous dark page */
body{background:#100f0d;}
@media print{
  @page{ size:A4 landscape; margin:8mm; }
  html,body{background:#100f0d !important;}
  *,*::before,*::after{
    -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;
    animation-delay:-99s !important; animation-duration:.001s !important;
    animation-iteration-count:1 !important; animation-fill-mode:both !important;
    animation-play-state:running !important; transition-duration:0s !important;
  }
  /* reveal everything, freeze motion */
  .reveal, [data-stagger] > *{opacity:1 !important; transform:none !important; filter:none !important;}
  [data-par], [data-zoom]{transform:none !important;}
  .hero-claim{opacity:1 !important; transform:none !important;}
  /* hide app chrome */
  .topbar, .layoutguide, [data-tweaks-panel], .tweaks-panel{display:none !important;}
  /* cap full-bleed heights so each fits a landscape page */
  .vhero, .vhero.fb{height:560px !important; min-height:0 !important;}
  .statement{min-height:460px !important;}
  .techfull{min-height:0 !important;}
  .vhero .vbg img, .statement .bg img{height:118% !important;}
  /* pagination: keep blocks intact */
  section, .sec, .fb-band, .sbox, .fixcard, .techfull, .statement, .vhero,
  .refcol, .ctabanner, .acad3 > *, .reffeat, .logowall{break-inside:avoid;}
  .band-dark, .statement, .techfull{break-before:page;}
  footer.wf{break-before:page;}
  /* annotations / sketch notes are useful in a wireframe PDF — keep them */
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="wf-shared.jsx?v=12"></script>
<script type="text/babel" src="wf-directionA.jsx?v=14"></script>
<script type="text/babel" data-presets="react">
const { useEffect, useRef } = React;

function PrintApp() {
  const rootRef = useRef(null);
  useEffect(() => {
    const root = rootRef.current;
    if (!root) return;
    // force all reveal/stagger sections visible, clear any inline transforms
    root.querySelectorAll(".reveal, [data-stagger]").forEach((el) => el.classList.add("in"));
    root.querySelectorAll("[data-par],[data-zoom]").forEach((el) => { el.style.transform = "none"; });
  }, []);
  const appStyle = { "--accent": "#e0542b", "--type": 1.18, "--sp": 1.18, "--scrim": 0.88 };
  return (
    <div ref={rootRef} className="app hero-cinematic" style={appStyle}>
      <DirectionA />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PrintApp />);

// auto-print once fonts + render settle
(async function () {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  // wait for images
  const imgs = Array.from(document.images);
  await Promise.all(imgs.map((im) => im.complete ? Promise.resolve() : new Promise((r) => { im.onload = im.onerror = r; })));
  setTimeout(() => window.print(), 600);
})();
</script>
</body>
</html>
