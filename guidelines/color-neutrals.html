<!-- @dsCard group="Colors" viewport="700x180" subtitle="Teplé tmavé povrchy" name="Neutrály / povrchy" -->
<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--pm-font-body);padding:22px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .sw{flex:1;min-width:96px;border-radius:var(--pm-radius-md);overflow:hidden;border:1px solid var(--border);}
  .chip{height:72px;}
  .meta{padding:9px 11px;background:var(--surface);}
  .name{font-family:var(--pm-font-mono);font-size:11px;font-weight:700;}
  .hex{font-family:var(--pm-font-mono);font-size:10.5px;color:var(--text-mute);margin-top:2px;}
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--pm-black)"></div><div class="meta"><div class="name">black</div><div class="hex">#070605</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--pm-paper)"></div><div class="meta"><div class="name">paper</div><div class="hex">#100f0d</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--pm-surface-1)"></div><div class="meta"><div class="name">surface-1</div><div class="hex">#1a1813</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--pm-surface-2)"></div><div class="meta"><div class="name">surface-2</div><div class="hex">#242019</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--pm-surface-3)"></div><div class="meta"><div class="name">surface-3</div><div class="hex">#2f2a22</div></div></div>
  </div>
</body></html>
