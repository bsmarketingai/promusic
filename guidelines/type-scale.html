<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--pm-font-display);padding:22px;}
  .r{display:flex;align-items:baseline;gap:16px;padding:5px 0;border-bottom:1px solid var(--border);}
  .r:last-child{border:0;}
  .tok{font-family:var(--pm-font-mono);font-size:10.5px;color:var(--text-mute);width:130px;flex:none;}
  .ex{font-weight:800;letter-spacing:-0.03em;line-height:1;}
</style></head><body>
  <div class="r"><span class="tok">display-1</span><span class="ex" style="font-size:46px">Aa</span></div>
  <div class="r"><span class="tok">display-2</span><span class="ex" style="font-size:38px">Aa Zvuk</span></div>
  <div class="r"><span class="tok">h1</span><span class="ex" style="font-size:30px">Vybrané realizace</span></div>
  <div class="r"><span class="tok">h2</span><span class="ex" style="font-size:24px">Co řešíte?</span></div>
  <div class="r"><span class="tok">lg / body / sm</span><span class="ex" style="font-size:18px;font-family:var(--pm-font-body);font-weight:500">Čtený text v Hanken Grotesk</span></div>
</body></html>
