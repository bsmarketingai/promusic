<!-- @dsCard group="Spacing" viewport="700x190" subtitle="Stínový systém pro dark UI" name="Stíny" -->
<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--pm-font-mono);padding:28px;}
  .row{display:flex;gap:26px;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .box{width:96px;height:64px;background:var(--surface-2);border-radius:var(--pm-radius-md);border:1px solid var(--border);}
  .n{font-size:10.5px;color:var(--text-mute);}
</style></head><body>
  <div class="row">
    <div class="col"><div class="box" style="box-shadow:var(--pm-shadow-sm)"></div><span class="n">shadow-sm</span></div>
    <div class="col"><div class="box" style="box-shadow:var(--pm-shadow-md)"></div><span class="n">shadow-md</span></div>
    <div class="col"><div class="box" style="box-shadow:var(--pm-shadow-lg)"></div><span class="n">shadow-lg</span></div>
    <div class="col"><div class="box" style="box-shadow:var(--pm-shadow-accent);border-color:var(--accent)"></div><span class="n">shadow-accent</span></div>
  </div>
</body></html>
