<!-- @dsCard group="Spacing" viewport="700x170" subtitle="4px base scale" name="Spacing" -->
<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--pm-font-mono);padding:24px;}
  .row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .bar{background:var(--accent);border-radius:3px;width:26px;}
  .n{font-size:10px;color:var(--text-mute);}
</style></head><body>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px"></div><span class="n">1 · 4</span></div>
    <div class="col"><div class="bar" style="height:8px"></div><span class="n">2 · 8</span></div>
    <div class="col"><div class="bar" style="height:12px"></div><span class="n">3 · 12</span></div>
    <div class="col"><div class="bar" style="height:16px"></div><span class="n">4 · 16</span></div>
    <div class="col"><div class="bar" style="height:24px"></div><span class="n">5 · 24</span></div>
    <div class="col"><div class="bar" style="height:32px"></div><span class="n">6 · 32</span></div>
    <div class="col"><div class="bar" style="height:48px"></div><span class="n">7 · 48</span></div>
    <div class="col"><div class="bar" style="height:64px"></div><span class="n">8 · 64</span></div>
    <div class="col"><div class="bar" style="height:88px"></div><span class="n">9 · 96</span></div>
  </div>
</body></html>
