<!-- @dsCard group="Type" viewport="700x170" subtitle="Space Mono — eyebrow, štítky, data" name="Mono / Space Mono" -->
<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--pm-font-mono);padding:24px;}
  .grid{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  .tag{font-size:11px;border:1px solid var(--border-strong);border-radius:4px;padding:4px 9px;color:var(--text-soft);}
  .data{font-size:28px;font-weight:700;color:var(--text);}
  .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-mute);}
  .stack{margin-top:16px;}
</style></head><body>
  <div class="grid">
    <span class="eyebrow">Profesionální audio · od 1997</span>
    <span class="tag">TURNÉ / SVĚTLA</span>
    <span class="tag">L-ISA</span>
    <span class="tag">DiGiCo</span>
  </div>
  <div class="grid stack">
    <span class="data">28&nbsp;let</span><span class="lbl">na trhu</span>
    <span class="data" style="margin-left:18px">17</span><span class="lbl">zemí Evropy</span>
    <span class="data" style="margin-left:18px">20+</span><span class="lbl">značek</span>
  </div>
</body></html>
